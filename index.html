<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0a" />
    <meta name="author" content="DeployKit" />

    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Preconnect to Google Fonts (eliminates DNS+TLS latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking font loading -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Preconnect to devicons CDN -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <link rel="alternate" type="application/rss+xml" title="DeployKit Blog" href="/rss.xml" />
    <link rel="alternate" type="application/rss+xml" title="Blog de DeployKit" href="/es/rss.xml" />

    <!-- Page-specific title, meta, canonical, hreflang and JSON-LD (prerender / useSeo) -->
    <!--app-head-->

    <script defer src="https://metrics.ridel.dev/script.js" data-website-id="0464e847-010a-4686-889d-47bd9441173d"></script>

    <!-- Inline critical CSS to prevent FOUC -->
    <style>
      body { background-color: #0b0b0a; color: #e8e6e1; margin: 0; }
      #root { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
